name: Task
description: A piece of work that isn't a bug or a feature — a chore, a cleanup, a release step, a doc.
title: "Task: "
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ]
        - [ ]
  - type: textarea
    id: notes
    attributes:
      label: Notes
